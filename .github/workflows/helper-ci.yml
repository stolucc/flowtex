name: helper-ci

# Lightweight per-push CI for the helper. Runs `go vet`, `go build`,
# and `go test ./...` across ubuntu, macos, and windows runners so a
# platform-specific regression (e.g. a Windows-only path bug, a
# darwin-only cgo issue) is caught immediately — not at release-tag
# time when the operator is already mid-deploy.
#
# Path-filter is deliberately narrow: only helper sources + this
# workflow's own file trigger it. Client / server / docs changes
# don't pay the matrix cost.

on:
  push:
    paths:
      - 'helper/**'
      - '.github/workflows/helper-ci.yml'
  pull_request:
    paths:
      - 'helper/**'
      - '.github/workflows/helper-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS uses the same go-version channel as Linux/Windows so a
        # subtle version-pinning bug can't sneak in on one runner only.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: helper/go.sum

      - name: go vet
        working-directory: helper
        run: go vet ./...

      - name: go test
        working-directory: helper
        run: go test ./...

      # Build sanity — the test pass above doesn't exercise the
      # release-style build, in particular the Windows GUI subsystem
      # flag. Run the same command the Makefile uses (without the
      # tagged ldflags injection — those are release-only).
      - name: go build
        working-directory: helper
        run: go build ./...

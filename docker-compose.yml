services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-flowtex}
      PGUSER: ${PGUSER:-flowtex}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      APP_URL: ${APP_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DISABLE_TLS_REDIRECT: "true"
      # DOCX image conversion path is disabled by default in the container
      # because the base image doesn't ship rsvg/imagemagick/libreoffice.
      # Build a custom image with those tools + docs/imagemagick-policy.xml
      # installed if your users need DOCX image import.
      DISABLE_IMAGE_CONVERSION: "1"
      # GitHub OAuth (optional)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # SMTP (optional — can also be configured in Admin Dashboard)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Redis (optional — uncomment redis service below to enable)
      # REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # ── Container hardening (matches SECURITY.md guidance) ──────────────
    # The image runs as the non-root `flowtex` user (Dockerfile USER 10001).
    # Below: lock the rootfs read-only, drop all Linux capabilities, prevent
    # privilege escalation via setuid binaries, and bound memory + PIDs so
    # one runaway compile or DOCX import can't take down the host.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    # Writable scratch areas under the read-only rootfs. /tmp is needed by
    # latexmk (intermediate aux files), LibreOffice (per-invocation
    # UserInstallation), and Node's module loader for module cache misses.
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - compile-workdir:/app/projects
      - git-repos:/app/git-repos

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-flowtex}
      POSTGRES_USER: ${PGUSER:-flowtex}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-flowtex}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Uncomment to enable Redis for WebSocket horizontal scaling
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redisdata:/data

volumes:
  pgdata:
  compile-workdir:
  git-repos:
  caddy_data:
  caddy_config:
  # redisdata:

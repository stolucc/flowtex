<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .subtitle { font-size: 12px; fill: #64748b; }
    .box { rx: 8; ry: 8; stroke-width: 1.5; }
    .box-client { fill: #eff6ff; stroke: #3b82f6; }
    .box-server { fill: #f0fdf4; stroke: #22c55e; }
    .box-db { fill: #fef3c7; stroke: #f59e0b; }
    .box-decision { fill: #faf5ff; stroke: #a855f7; }
    .label { font-size: 12px; font-weight: 600; }
    .label-client { fill: #1d4ed8; }
    .label-server { fill: #16a34a; }
    .label-db { fill: #b45309; }
    .detail { font-size: 11px; fill: #475569; }
    .step { font-size: 11px; font-weight: 700; fill: #fff; }
    .step-bg { fill: #3b82f6; }
    .connector { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .connector-blue { stroke: #3b82f6; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); stroke-dasharray: 6,3; }
    .connector-green { stroke: #22c55e; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green); }
    .section-label { font-size: 10px; font-weight: 700; fill: #94a3b8; letter-spacing: 1px; }
    .note { font-size: 10px; fill: #94a3b8; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title">FlowTex — Project File Loading Flow</text>
  <text x="450" y="48" text-anchor="middle" class="subtitle">What happens when a user opens an existing project after login</text>

  <!-- Legend -->
  <rect x="30" y="60" width="12" height="12" rx="2" class="box box-client"/>
  <text x="48" y="71" class="detail">Client (React)</text>
  <rect x="160" y="60" width="12" height="12" rx="2" class="box box-server"/>
  <text x="178" y="71" class="detail">Server (Express)</text>
  <rect x="310" y="60" width="12" height="12" rx="2" class="box box-db"/>
  <text x="328" y="71" class="detail">PostgreSQL</text>
  <line x1="440" y1="66" x2="480" y2="66" class="connector-blue"/>
  <text x="488" y="71" class="detail">WebSocket</text>

  <!-- ═══════════ PHASE 1: URL Parse + Project Lookup ═══════════ -->
  <text x="50" y="105" class="section-label">PHASE 1 — IDENTIFY PROJECT</text>

  <!-- Step 1: URL Parse -->
  <circle cx="52" cy="130" r="10" class="step-bg"/>
  <text x="52" y="134" text-anchor="middle" class="step">1</text>
  <rect x="70" y="118" width="280" height="44" class="box box-client"/>
  <text x="82" y="136" class="label label-client">useProject hook — URL Parse</text>
  <text x="82" y="152" class="detail">getProjectIdFromUrl() reads /project/:id</text>

  <!-- Arrow down -->
  <line x1="210" y1="162" x2="210" y2="180" class="connector"/>

  <!-- Step 2: Fetch project list -->
  <circle cx="52" cy="200" r="10" class="step-bg"/>
  <text x="52" y="204" text-anchor="middle" class="step">2</text>
  <rect x="70" y="186" width="280" height="44" class="box box-client"/>
  <text x="82" y="204" class="label label-client">GET /api/projects</text>
  <text x="82" y="220" class="detail">Fetches all user's projects to find match</text>

  <!-- Arrow right to server -->
  <line x1="350" y1="208" x2="470" y2="208" class="connector"/>

  <!-- Server: list projects -->
  <rect x="478" y="186" width="260" height="44" class="box box-server"/>
  <text x="490" y="204" class="label label-server">projectService.listUserProjects()</text>
  <text x="490" y="220" class="detail">SELECT p.* JOIN project_members …</text>

  <!-- Arrow right to DB -->
  <line x1="738" y1="208" x2="790" y2="208" class="connector"/>
  <rect x="798" y="196" width="80" height="24" class="box box-db"/>
  <text x="838" y="213" text-anchor="middle" class="label label-db">projects</text>

  <!-- Arrow back left -->
  <path d="M 798,220 L 770,220 L 770,240 L 230,240 L 230,248" class="connector" style="stroke-dasharray:4,3"/>
  <text x="500" y="236" class="note">Returns array of project objects (with tags, members, etc.)</text>

  <!-- Step 3: Match + setState -->
  <circle cx="52" cy="268" r="10" class="step-bg"/>
  <text x="52" y="272" text-anchor="middle" class="step">3</text>
  <rect x="70" y="254" width="280" height="44" class="box box-client"/>
  <text x="82" y="272" class="label label-client">setProject(found)</text>
  <text x="82" y="288" class="detail">projects.find(p =&gt; p.id === urlId)</text>

  <!-- ═══════════ PHASE 2: Load Files ═══════════ -->
  <text x="50" y="325" class="section-label">PHASE 2 — LOAD FILES (triggered by project state change)</text>

  <!-- Step 4: useEffect fires -->
  <circle cx="52" cy="352" r="10" class="step-bg"/>
  <text x="52" y="356" text-anchor="middle" class="step">4</text>
  <rect x="70" y="338" width="280" height="44" class="box box-client"/>
  <text x="82" y="356" class="label label-client">useEffect [project] fires</text>
  <text x="82" y="372" class="detail">GET /api/projects/:id/files</text>

  <!-- Arrow right to server -->
  <line x1="350" y1="360" x2="470" y2="360" class="connector"/>

  <!-- Server: get files -->
  <rect x="478" y="338" width="260" height="44" class="box box-server"/>
  <text x="490" y="356" class="label label-server">projectService.getProjectFiles()</text>
  <text x="490" y="372" class="detail">SELECT * FROM files WHERE project_id</text>

  <!-- Arrow right to DB -->
  <line x1="738" y1="360" x2="790" y2="360" class="connector"/>
  <rect x="798" y="348" width="80" height="24" class="box box-db"/>
  <text x="838" y="365" text-anchor="middle" class="label label-db">files</text>

  <!-- Arrow back left -->
  <path d="M 798,372 L 770,372 L 770,392 L 230,392 L 230,400" class="connector" style="stroke-dasharray:4,3"/>
  <text x="500" y="388" class="note">Returns all files: { id, path, content, is_binary }</text>

  <!-- Step 5: Pick active file -->
  <circle cx="52" cy="420" r="10" class="step-bg"/>
  <text x="52" y="424" text-anchor="middle" class="step">5</text>
  <rect x="70" y="406" width="360" height="60" class="box box-decision"/>
  <text x="82" y="424" class="label" style="fill:#7c3aed">Select Active File</text>
  <text x="82" y="440" class="detail">1. ?file=id from URL → use that file</text>
  <text x="82" y="454" class="detail">2. project.main_file (e.g. "main.tex") → use that</text>
  <text x="82" y="466" class="detail" style="display:none">3. Fall back to first file in list</text>
  <text x="82" y="456" class="detail">3. Otherwise → loadedFiles[0]</text>

  <!-- ═══════════ PHASE 3: WebSocket + Editor ═══════════ -->
  <text x="50" y="500" class="section-label">PHASE 3 — WEBSOCKET JOIN + EDITOR MOUNT</text>

  <!-- Step 6: WS join -->
  <circle cx="52" cy="528" r="10" class="step-bg"/>
  <text x="52" y="532" text-anchor="middle" class="step">6</text>
  <rect x="70" y="514" width="280" height="44" class="box box-client"/>
  <text x="82" y="532" class="label label-client">useWebSocket — send join</text>
  <text x="82" y="548" class="detail">{ type: "join", projectId }</text>

  <!-- WS arrow -->
  <line x1="350" y1="536" x2="470" y2="536" class="connector-blue"/>

  <!-- Server WS -->
  <rect x="478" y="514" width="260" height="44" class="box box-server"/>
  <text x="490" y="532" class="label label-server">handleJoin(ws, msg, state)</text>
  <text x="490" y="548" class="detail">Verify membership → add to room</text>

  <!-- Arrow right to DB -->
  <line x1="738" y1="536" x2="790" y2="536" class="connector"/>
  <rect x="798" y="518" width="80" height="36" class="box box-db"/>
  <text x="838" y="535" text-anchor="middle" class="label label-db">project_</text>
  <text x="838" y="548" text-anchor="middle" class="label label-db">members</text>

  <!-- WS response back -->
  <path d="M 478,558 L 460,558 L 460,576 L 358,576" class="connector-blue"/>
  <text x="370" y="572" class="note">{ type: "joined" } + presence broadcast</text>

  <!-- Step 7: Editor mounts -->
  <circle cx="52" cy="606" r="10" class="step-bg"/>
  <text x="52" y="610" text-anchor="middle" class="step">7</text>
  <rect x="70" y="592" width="360" height="44" class="box box-client"/>
  <text x="82" y="610" class="label label-client">Editor.jsx mounts with activeFile</text>
  <text x="82" y="626" class="detail">CodeMirror view created with activeFile.content</text>

  <!-- ═══════════ PHASE 4: Parallel loads ═══════════ -->
  <text x="50" y="665" class="section-label">PHASE 2b — PARALLEL LOADS (also triggered by project change)</text>

  <!-- Members -->
  <circle cx="52" cy="692" r="10" style="fill:#64748b"/>
  <text x="52" y="696" text-anchor="middle" class="step">‖</text>
  <rect x="70" y="678" width="280" height="34" class="box box-client"/>
  <text x="82" y="700" class="label label-client">GET /api/projects/:id/members</text>

  <line x1="350" y1="695" x2="470" y2="695" class="connector"/>
  <rect x="478" y="678" width="260" height="34" class="box box-server"/>
  <text x="490" y="700" class="detail">Returns member list for sidebar</text>

  <!-- Compilation -->
  <rect x="70" y="722" width="280" height="34" class="box box-client"/>
  <text x="82" y="744" class="label label-client">useCompilation — auto-compile</text>

  <line x1="350" y1="739" x2="470" y2="739" class="connector"/>
  <rect x="478" y="722" width="260" height="34" class="box box-server"/>
  <text x="490" y="744" class="detail">POST /api/compile → pdflatex/latexmk</text>

  <!-- Summary box -->
  <rect x="50" y="775" width="820" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="460" y="797" text-anchor="middle" class="detail" style="font-weight:600">
    Summary: URL → project lookup (DB) → file fetch (DB) → active file selection → WebSocket join → CodeMirror mount → auto-compile
  </text>
</svg>
